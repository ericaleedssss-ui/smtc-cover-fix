name: Standalone Rhine migration validation

# Retained migration-branch validation. main uses build-smtc.yml directly.
on:
  workflow_dispatch:
  push:
    branches:
      - migration/full-source-20261102
    paths:
      - app/**
      - migration/**
      - .github/workflows/standalone-candidate.yml

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    env:
      NODE_VERSION: '22.14.0'
      NODE_PLATFORM: win-x64
      RHINE_BUILD_TYPE: Release
      RHINE_VERSION: v1.2.0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            app/MusicBridge/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify standalone inputs and migration guards
        run: |
          python ../migration/verify-source.py --stamp ../migration/results/source.json
          python ../migration/test-verification.py
      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
          arch: win64_msvc2022_64
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7
          modules: qtshadertools qtmultimedia
          cache: true
      - name: Install locked build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check source boundaries
        run: node scripts/check-repository.cjs
      - name: Check scrobble and personal FM integration
        run: python ../migration/check-integrations.py
      - name: Download standalone Node with checksum verification
        shell: bash
        run: bash ../migration/prepare-node.sh
      - name: Build and deploy directly from full source
        env:
          QT_ROOT: ${{ env.QT_ROOT_DIR }}
        run: npm run build
      - name: Run packaged glass UI checks
        env:
          QSG_RHI_PREFER_SOFTWARE_RENDERER: '1'
          QSG_RHI_BACKEND: d3d11
        run: python ../migration/run-ui-check.py --output ../migration/results/frosted-qa
      - name: Run existing native and bridge regressions
        run: npm test
      - name: Create portable ZIP
        run: npm run share
      - name: Verify ZIP contents and notices
        run: >-
          python ../migration/verify-package.py
          --app "output/windows/RHINE MUSIC DATABASE"
          --zip output/RhineMusicDatabase-v1.2.0-Windows-x64.zip
          --report ../migration/results/package.json
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Standalone-migration-evidence
          path: |
            migration/results/
            app/output/qt-build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 14
      - name: Upload candidate portable build
        uses: actions/upload-artifact@v4
        with:
          name: Rhine-Standalone-Candidate-Windows-x64
          path: app/output/RhineMusicDatabase-v1.2.0-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
