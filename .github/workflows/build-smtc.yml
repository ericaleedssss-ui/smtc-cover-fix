name: Build SMTC cover fix
'on':
  workflow_dispatch: {}
  push:
    paths:
    - .github/workflows/build-smtc.yml
permissions:
  contents: read
concurrency:
  group: smtc-cover-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rhine:
    name: Rhine G53 navigation, history and glass player bar
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      NODE_VERSION: 22.14.0
      RHINE_BUILD_TYPE: Release
      RHINE_VERSION: v1.2.0
    steps:
    - uses: actions/checkout@v4
      with:
        repository: MikeQu223/Rhine-Music-Database
        ref: b8b8ad5ed661fa32404731f1b09f7c37d34bf070
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: 22.14.0
        cache: npm
        cache-dependency-path: 'package-lock.json

          MusicBridge/package-lock.json

          '
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Apply SMTC artwork fix
      shell: python
      env:
        PATCH_PART_000: 
        PATCH_PART_001: 
        PATCH_PART_002: 
        PATCH_PART_003: 
        PATCH_PART_004: 
        PATCH_PART_005: 
        PATCH_SHA256: 7cbc15e7184bfb4797c0b3ceab86a4e19ec0dc7118961e6be522fcdc1a9a23f8
        PATCH_ENCODING: gzip
      run: 'import base64, hashlib, os, pathlib, subprocess, gzip

        encoded = ''''.join(os.environ[key] for key in sorted(os.environ) if key.startswith(''PATCH_PART_''))

        patch = gzip.decompress(base64.b64decode(encoded, validate=True))

        assert hashlib.sha256(patch).hexdigest() == os.environ[''PATCH_SHA256'']

        path = pathlib.Path(os.environ[''RUNNER_TEMP'']) / ''smtc-artwork.patch''

        path.write_bytes(patch)

        subprocess.run([''git'', ''apply'', ''--check'', str(path)], check=True)

        subprocess.run([''git'', ''apply'', str(path)], check=True)

        subprocess.run([''git'', ''diff'', ''--check''], check=True)

        print(''SMTC artwork patch applied successfully'')

        '
    - name: Configure MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
    - uses: jurplel/install-qt-action@v4
      with:
        version: 6.12.0
        arch: win64_msvc2022_64
        aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7
        modules: qtshadertools qtmultimedia
        cache: 'true'
    - name: Install build dependencies
      run: npm ci --ignore-scripts --no-audit --no-fund
    - name: Check repository boundaries
      run: node scripts/check-repository.cjs
    - name: Download standalone Node and verify checksum
      shell: bash
      env:
        NODE_PLATFORM: win-x64
      run: "set -euo pipefail\ndistribution=\"node-v${NODE_VERSION}-${NODE_PLATFORM}\"\nextension=tar.gz\n[[ \"$RUNNER_OS\"\
        \ == Windows ]] && extension=zip\narchive=\"${distribution}.${extension}\"\ncd \"$RUNNER_TEMP\"\ncurl --fail --location\
        \ --retry 3 \"https://nodejs.org/dist/v${NODE_VERSION}/${archive}\" -o \"$archive\"\ncurl --fail --location --retry\
        \ 3 \"https://nodejs.org/dist/v${NODE_VERSION}/SHASUMS256.txt\" -o SHASUMS256.txt\npython - \"$archive\" <<'PY'\n\
        import hashlib, pathlib, sys\narchive = pathlib.Path(sys.argv[1])\nchecksums = dict(line.split()[::-1] for line in\
        \ pathlib.Path('SHASUMS256.txt').read_text().splitlines())\nassert hashlib.sha256(archive.read_bytes()).hexdigest()\
        \ == checksums[archive.name], 'Node checksum mismatch'\nPY\nif [[ \"$RUNNER_OS\" == Windows ]]; then\n  python -m\
        \ zipfile -e \"$archive\" .\n  echo \"RHINE_NODE_BINARY=$(cygpath -w \"$RUNNER_TEMP/$distribution/node.exe\")\" >>\
        \ \"$GITHUB_ENV\"\n  echo \"RHINE_NODE_LICENSE=$(cygpath -w \"$RUNNER_TEMP/$distribution/LICENSE\")\" >> \"$GITHUB_ENV\"\
        \nelse\n  tar -xzf \"$archive\"\n  echo \"RHINE_NODE_BINARY=$RUNNER_TEMP/$distribution/bin/node\" >> \"$GITHUB_ENV\"\
        \n  echo \"RHINE_NODE_LICENSE=$RUNNER_TEMP/$distribution/LICENSE\" >> \"$GITHUB_ENV\"\nfi\n"
    - name: Build and deploy
      run: npm run build
      env:
        QT_ROOT: ${{ env.QT_ROOT_DIR }}
    - name: Verify frosted UI and render preview
      shell: python
      env:
        QSG_RHI_PREFER_SOFTWARE_RENDERER: '1'
        QSG_RHI_BACKEND: d3d11
        COMMENTS_FIXTURE: 
      run: "import base64, os, pathlib, subprocess\napp = pathlib.Path('output/windows/RHINE MUSIC DATABASE').resolve()\n\
        qa = pathlib.Path(os.environ['RUNNER_TEMP']) / 'frosted-qa'\nqa.mkdir(parents=True, exist_ok=True)\n(qa / 'comments-fixture.json').write_bytes(base64.b64decode(os.environ['COMMENTS_FIXTURE']))\n\
        result = subprocess.run([str(app / 'RHINE MUSIC DATABASE.exe'), '--frosted-self-test', str(qa)], cwd=app, timeout=360,\
        \ capture_output=True, text=True, encoding='utf-8', errors='replace')\nprint(result.stdout)\nprint(result.stderr)\n\
        preview = qa / 'preview-on.png'\nif preview.is_file():\n    encoded = base64.b64encode(preview.read_bytes()).decode()\n\
        \    print('FROST_PREVIEW_BEGIN')\n    for index in range(0, len(encoded), 800):\n        print('FROST_PNG:' + encoded[index:index+800])\n\
        \    print('FROST_PREVIEW_END')\ncomments = qa / 'preview-comments.png'\nif comments.is_file():\n    encoded = base64.b64encode(comments.read_bytes()).decode()\n\
        \    for index in range(0, len(encoded), 800):\n        print('COMMENTS_PNG:' + encoded[index:index+800])\n\npreview\
        \ = qa / 'preview-album-page.png'\nif preview.is_file():\n    encoded = base64.b64encode(preview.read_bytes()).decode()\n\
        \    for index in range(0, len(encoded), 800):\n        print('ALBUM_PNG:' + encoded[index:index+800])\n\npreview\
        \ = qa / 'preview-recommendations.png'\nif preview.is_file():\n    encoded = base64.b64encode(preview.read_bytes()).decode()\n\
        \    for index in range(0, len(encoded), 800):\n        print('REC_PNG:' + encoded[index:index+800])\n\nfor name,\
        \ prefix in [('preview-discover-covers.png', 'DISCOVER_PNG:'), ('preview-profile-recent.png', 'RECENT_PNG:'), ('preview-profile-ranking.png',\
        \ 'RANK_PNG:'), ('preview-user-profile.png', 'PROFILE_PNG:'), ('preview-lyrics-browse.png', 'LYRICS_PNG:'), ('preview-desktop-lyrics.png',\
        \ 'DESKTOP_PNG:'), ('preview-desktop-lyrics-hover.png', 'DESKTOP_HOVER_PNG:'), ('preview-desktop-settings.png', 'DESKTOP_SETTINGS_PNG:'),\
        \ ('preview-playlist-entry.png', 'PLAYLIST_ENTRY_PNG:'), ('preview-playlist-detail.png', 'PLAYLIST_DETAIL_PNG:')]:\n\
        \    preview = qa / name\n    if preview.is_file():\n        encoded = base64.b64encode(preview.read_bytes()).decode()\n\
        \        for index in range(0, len(encoded), 800):\n            print(prefix + encoded[index:index+800])\n\n\nfor\
        \ name, prefix in [(\"preview-side-navigation.png\", \"SIDE_NAV_PNG:\"), (\"preview-discover-glass.png\", \"DISCOVER_GLASS_PNG:\"\
        )]:\n    preview = qa / name\n    if preview.is_file():\n        encoded = base64.b64encode(preview.read_bytes()).decode()\n\
        \        for index in range(0, len(encoded), 800):\n            print(prefix + encoded[index:index+800])\n\nresult.check_returncode()\n"
    - name: Upload frosted UI previews
      uses: actions/upload-artifact@v4
      with:
        name: Frosted-UI-Previews
        path: ${{ runner.temp }}/frosted-qa/*.png
        if-no-files-found: error
        retention-days: 7
      if: always()
    - name: Run offline regressions
      run: npm test
    - name: Create distribution ZIP
      run: npm run share
    - name: Label the test build
      shell: python
      run: "import pathlib, shutil\nout = pathlib.Path('smtc-download')\nout.mkdir()\nsource = pathlib.Path('output/RhineMusicDatabase-v1.2.0-Windows-x64.zip')\n\
        assert source.is_file(), 'Expected portable application archive was not generated'\nshutil.copyfile(source, out /\
        \ 'Rhine-G53-Navigation-Playerbar-Windows-x64.zip')\n(out / 'BUILD-INFO.txt').write_text(\n    'G53 navigation, page\
        \ history, reading sizes and glass player bar; based on Rhine v1.2.0\\n'\n    'Source: https://github.com/MikeQu223/Rhine-Music-Database/tree/b8b8ad5ed661fa32404731f1b09f7c37d34bf070\\\
        n'\n    'The application is modified with an SMTC thumbnail patch.\\n'\n    'CI build and offline tests must pass\
        \ before this artifact is uploaded.\\n'\n    'Interactive Windows playback and overlay behavior still need user verification.\\\
        n'\n    'Extract into a new folder; keep the original application as a fallback.\\n', encoding='utf-8')\n"
    - name: Downloadable Rhine test build
      uses: actions/upload-artifact@v4
      with:
        name: Rhine-G53-Navigation-Playerbar-Windows-x64
        path: smtc-download/
        if-no-files-found: error
        retention-days: 7
  overlay:
    name: Overlay v3.1.1 + late artwork updates
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        repository: xw66/Cloud-Music-overlay-for-Forza-Horizon
        ref: ebb9e159a7faa88b58367796034b24f56a15d4f7
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Apply SMTC artwork fix
      shell: python
      env:
        PATCH_PART_000: 
        PATCH_SHA256: fa579439cb443a315d5af1c27a4a0969ffb9ad51033b46bc9cd96bcb9ee262c1
        PATCH_ENCODING: gzip
      run: 'import base64, hashlib, os, pathlib, subprocess, gzip

        encoded = ''''.join(os.environ[key] for key in sorted(os.environ) if key.startswith(''PATCH_PART_''))

        patch = gzip.decompress(base64.b64decode(encoded, validate=True))

        assert hashlib.sha256(patch).hexdigest() == os.environ[''PATCH_SHA256'']

        path = pathlib.Path(os.environ[''RUNNER_TEMP'']) / ''smtc-artwork.patch''

        path.write_bytes(patch)

        subprocess.run([''git'', ''apply'', ''--check'', str(path)], check=True)

        subprocess.run([''git'', ''apply'', str(path)], check=True)

        subprocess.run([''git'', ''diff'', ''--check''], check=True)

        print(''SMTC artwork patch applied successfully'')

        '
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.302
    - name: Run overlay regression tests
      run: dotnet test tests/HorizonRadioOverlay.Tests/HorizonRadioOverlay.Tests.csproj -c Release --logger trx --results-directory
        artifacts/test-results
    - name: Build standalone Windows overlay
      run: dotnet publish HorizonRadioOverlay.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true
        -p:DebugSymbols=false -p:DebugType=None -o publish
    - name: Package overlay test build
      shell: pwsh
      run: 'New-Item -ItemType Directory -Path smtc-download -Force | Out-Null

        @''

        SMTC artwork test build, based on HorizonRadioOverlay v3.1.1.

        Modified to accept late SMTC thumbnails and clear previous artwork on a new track without artwork.

        Compilation and regression tests must pass before upload.

        Interactive Windows playback still needs verification.

        ''@ | Set-Content -Encoding utf8 publish/BUILD-INFO.txt

        Compress-Archive -Path publish/* -DestinationPath smtc-download/HorizonRadioOverlay-v3.1.1-SMTC-test-Windows-x64.zip

        '
    - name: Downloadable overlay test build
      uses: actions/upload-artifact@v4
      with:
        name: 02-Overlay-SMTC-Cover-Fix-Windows-x64
        path: smtc-download/
        if-no-files-found: error
        retention-days: 7
