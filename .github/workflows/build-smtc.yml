name: Build SMTC cover fix
'on':
  workflow_dispatch: {}
  push:
    paths:
    - .github/workflows/build-smtc.yml
permissions:
  contents: read
concurrency:
  group: smtc-cover-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rhine:
    name: Rhine v1.2.0 + covers, glass and comments
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      NODE_VERSION: 22.14.0
      RHINE_BUILD_TYPE: Release
      RHINE_VERSION: v1.2.0
    steps:
    - uses: actions/checkout@v4
      with:
        repository: MikeQu223/Rhine-Music-Database
        ref: b8b8ad5ed661fa32404731f1b09f7c37d34bf070
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: 22.14.0
        cache: npm
        cache-dependency-path: 'package-lock.json

          MusicBridge/package-lock.json

          '
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Apply SMTC artwork fix
      shell: python
      env:
        PATCH_PART_000: 
        PATCH_PART_001: 
        PATCH_PART_002: 
        PATCH_PART_003: 
        PATCH_PART_004: 
        PATCH_PART_005: 
        PATCH_PART_006: 
        PATCH_PART_007: 
        PATCH_PART_008: 
        PATCH_PART_009: 
        PATCH_SHA256: 7603913824d5f9d4b88e6b0e3e395e430fff0ac08326b4bf00b2dd3e098e3d14
      run: |
        import base64, hashlib, os, pathlib, subprocess
        encoded = ''.join(os.environ[key] for key in sorted(os.environ) if key.startswith('PATCH_PART_'))
        patch = base64.b64decode(encoded, validate=True)
        assert hashlib.sha256(patch).hexdigest() == os.environ['PATCH_SHA256']
        path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'smtc-artwork.patch'
        path.write_bytes(patch)
        subprocess.run(['git', 'apply', '--check', str(path)], check=True)
        subprocess.run(['git', 'apply', str(path)], check=True)
        subprocess.run(['git', 'diff', '--check'], check=True)
        print('SMTC artwork patch applied successfully')
    - name: Configure MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64
    - uses: jurplel/install-qt-action@v4
      with:
        version: 6.12.0
        arch: win64_msvc2022_64
        aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7
        modules: qtshadertools qtmultimedia
        cache: 'true'
    - name: Install build dependencies
      run: npm ci --ignore-scripts --no-audit --no-fund
    - name: Check repository boundaries
      run: node scripts/check-repository.cjs
    - name: Download standalone Node and verify checksum
      shell: bash
      env:
        NODE_PLATFORM: win-x64
      run: |
        set -euo pipefail
        distribution="node-v${NODE_VERSION}-${NODE_PLATFORM}"
        extension=tar.gz
        [[ "$RUNNER_OS" == Windows ]] && extension=zip
        archive="${distribution}.${extension}"
        cd "$RUNNER_TEMP"
        curl --fail --location --retry 3 "https://nodejs.org/dist/v${NODE_VERSION}/${archive}" -o "$archive"
        curl --fail --location --retry 3 "https://nodejs.org/dist/v${NODE_VERSION}/SHASUMS256.txt" -o SHASUMS256.txt
        python - "$archive" <<'PY'
        import hashlib, pathlib, sys
        archive = pathlib.Path(sys.argv[1])
        checksums = dict(line.split()[::-1] for line in pathlib.Path('SHASUMS256.txt').read_text().splitlines())
        assert hashlib.sha256(archive.read_bytes()).hexdigest() == checksums[archive.name], 'Node checksum mismatch'
        PY
        if [[ "$RUNNER_OS" == Windows ]]; then
          python -m zipfile -e "$archive" .
          echo "RHINE_NODE_BINARY=$(cygpath -w "$RUNNER_TEMP/$distribution/node.exe")" >> "$GITHUB_ENV"
          echo "RHINE_NODE_LICENSE=$(cygpath -w "$RUNNER_TEMP/$distribution/LICENSE")" >> "$GITHUB_ENV"
        else
          tar -xzf "$archive"
          echo "RHINE_NODE_BINARY=$RUNNER_TEMP/$distribution/bin/node" >> "$GITHUB_ENV"
          echo "RHINE_NODE_LICENSE=$RUNNER_TEMP/$distribution/LICENSE" >> "$GITHUB_ENV"
        fi
    - name: Build and deploy
      run: npm run build
      env:
        QT_ROOT: ${{ env.QT_ROOT_DIR }}
    - name: Verify frosted UI and render preview
      shell: python
      env:
        QSG_RHI_PREFER_SOFTWARE_RENDERER: '1'
        QSG_RHI_BACKEND: d3d11
        COMMENTS_FIXTURE: 
      run: |
        import base64, os, pathlib, subprocess
        app = pathlib.Path('output/windows/RHINE MUSIC DATABASE').resolve()
        qa = pathlib.Path(os.environ['RUNNER_TEMP']) / 'frosted-qa'
        qa.mkdir(parents=True, exist_ok=True)
        (qa / 'comments-fixture.json').write_bytes(base64.b64decode(os.environ['COMMENTS_FIXTURE']))
        result = subprocess.run([str(app / 'RHINE MUSIC DATABASE.exe'), '--frosted-self-test', str(qa)], cwd=app, timeout=180, capture_output=True, text=True, encoding='utf-8', errors='replace')
        print(result.stdout)
        print(result.stderr)
        preview = qa / 'preview-on.png'
        if preview.is_file():
            encoded = base64.b64encode(preview.read_bytes()).decode()
            print('FROST_PREVIEW_BEGIN')
            for index in range(0, len(encoded), 6000):
                print('FROST_PNG:' + encoded[index:index+6000])
            print('FROST_PREVIEW_END')
        comments = qa / 'preview-comments.png'
        if comments.is_file():
            encoded = base64.b64encode(comments.read_bytes()).decode()
            for index in range(0, len(encoded), 6000):
                print('COMMENTS_PNG:' + encoded[index:index+6000])
        result.check_returncode()
    - name: Upload frosted UI previews
      uses: actions/upload-artifact@v4
      with:
        name: Frosted-UI-Previews
        path: ${{ runner.temp }}/frosted-qa/*.png
        if-no-files-found: error
        retention-days: 7
    - name: Run offline regressions
      run: npm test
    - name: Create distribution ZIP
      run: npm run share
    - name: Label the test build
      shell: python
      run: |
        import pathlib, shutil
        out = pathlib.Path('smtc-download')
        out.mkdir()
        source = pathlib.Path('output/RhineMusicDatabase-v1.2.0-Windows-x64.zip')
        assert source.is_file(), 'Expected portable application archive was not generated'
        shutil.copyfile(source, out / 'RhineMusicDatabase-v1.2.0-SMTC-Frosted-Comments-Windows-x64.zip')
        (out / 'BUILD-INFO.txt').write_text(
            'SMTC artwork test build, based on Rhine v1.2.0\n'
            'Source: https://github.com/MikeQu223/Rhine-Music-Database/tree/b8b8ad5ed661fa32404731f1b09f7c37d34bf070\n'
            'The application is modified with an SMTC thumbnail patch.\n'
            'CI build and offline tests must pass before this artifact is uploaded.\n'
            'Interactive Windows playback and overlay behavior still need user verification.\n'
            'Extract into a new folder; keep the original application as a fallback.\n', encoding='utf-8')
    - name: Downloadable Rhine test build
      uses: actions/upload-artifact@v4
      with:
        name: 01-Rhine-SMTC-Frosted-Comments-Windows-x64
        path: smtc-download/
        if-no-files-found: error
        retention-days: 7
  overlay:
    name: Overlay v3.1.1 + late artwork updates
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        repository: xw66/Cloud-Music-overlay-for-Forza-Horizon
        ref: ebb9e159a7faa88b58367796034b24f56a15d4f7
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Apply SMTC artwork fix
      shell: python
      env:
        PATCH_PART_000: 
        PATCH_SHA256: fa579439cb443a315d5af1c27a4a0969ffb9ad51033b46bc9cd96bcb9ee262c1
      run: |
        import base64, hashlib, os, pathlib, subprocess
        encoded = ''.join(os.environ[key] for key in sorted(os.environ) if key.startswith('PATCH_PART_'))
        patch = base64.b64decode(encoded, validate=True)
        assert hashlib.sha256(patch).hexdigest() == os.environ['PATCH_SHA256']
        path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'smtc-artwork.patch'
        path.write_bytes(patch)
        subprocess.run(['git', 'apply', '--check', str(path)], check=True)
        subprocess.run(['git', 'apply', str(path)], check=True)
        subprocess.run(['git', 'diff', '--check'], check=True)
        print('SMTC artwork patch applied successfully')
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.302
    - name: Run overlay regression tests
      run: dotnet test tests/HorizonRadioOverlay.Tests/HorizonRadioOverlay.Tests.csproj -c Release --logger trx
        --results-directory artifacts/test-results
    - name: Build standalone Windows overlay
      run: dotnet publish HorizonRadioOverlay.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true
        -p:DebugSymbols=false -p:DebugType=None -o publish
    - name: Package overlay test build
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path smtc-download -Force | Out-Null
        @'
        SMTC artwork test build, based on HorizonRadioOverlay v3.1.1.
        Modified to accept late SMTC thumbnails and clear previous artwork on a new track without artwork.
        Compilation and regression tests must pass before upload.
        Interactive Windows playback still needs verification.
        '@ | Set-Content -Encoding utf8 publish/BUILD-INFO.txt
        Compress-Archive -Path publish/* -DestinationPath smtc-download/HorizonRadioOverlay-v3.1.1-SMTC-test-Windows-x64.zip
    - name: Downloadable overlay test build
      uses: actions/upload-artifact@v4
      with:
        name: 02-Overlay-SMTC-Cover-Fix-Windows-x64
        path: smtc-download/
        if-no-files-found: error
        retention-days: 7
